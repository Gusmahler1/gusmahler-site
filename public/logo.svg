<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" rx="60"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
  </g>

  <!-- Market chart line (background accent) -->
  <polyline
    points="80,580 160,520 240,545 320,460 400,400 460,420 520,350 580,310 660,280 720,240"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.5"
  />

  <!-- Chart area fill -->
  <polygon
    points="80,580 160,520 240,545 320,460 400,400 460,420 520,350 580,310 660,280 720,240 720,620 80,620"
    fill="#2563eb"
    opacity="0.04"
  />

  <!-- Tick mark dots on chart -->
  <circle cx="320" cy="460" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="520" cy="350" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="660" cy="280" r="5" fill="#60a5fa" opacity="0.8"/>

  <!-- Main monogram: PM -->
  <text
    x="400"
    y="390"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="200"
    font-weight="bold"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-8"
    opacity="0.97"
  >PM</text>

  <!-- Thin rule above tagline -->
  <line x1="220" y1="490" x2="580" y2="490" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="400"
    y="540"
    font-family="-apple-system, 'Helvetica Neue', sans-serif"
    font-size="32"
    font-weight="400"
    fill="#94a3b8"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="6"
  >WEEKLY</text>

  <!-- Bottom wordmark -->
  <text
    x="400"
    y="610"
    font-family="-apple-system, 'Helvetica Neue', sans-serif"
    font-size="18"
    font-weight="300"
    fill="#475569"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="3"
  >PREDICTION MARKETS</text>
</svg>
